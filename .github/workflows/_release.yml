name: Release pipeline (reusable)

# Build -> package -> attest -> publish. Linux only: zfleet runs where zfs (or
# ssh to it) lives. A static CGO_ENABLED=0 binary needs no code signing;
# integrity is covered by SHA256SUMS.txt + the build-provenance attestation,
# which is also what pkg0 verifies at install time.
# Invoked from release-tag.yml / release-manual.yml; not directly triggerable.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: 'Semver without the v prefix (e.g. 0.1.0), parsed from the tag by the caller'
      tag:
        required: true
        type: string
        description: 'Full tag name including the v prefix (e.g. v0.1.0)'
      draft:
        required: true
        type: boolean
        description: 'Create the GitHub release as a draft (not published)'

permissions:
  contents: write       # create release + upload assets
  id-token: write       # sigstore OIDC for attestation
  attestations: write   # write build provenance attestation

jobs:
  notices:
    name: Third-party notices + SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Generate third-party licenses + SBOM
        run: |
          go install github.com/google/go-licenses@latest
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          gobin="$(go env GOPATH)/bin"
          "$gobin/go-licenses" save ./cmd/zfleet --save_path=tpl-tree --force --ignore github.com/martona/zfleet
          "$gobin/cyclonedx-gomod" app -json -licenses -assert-licenses -main cmd/zfleet -output zfleet.cdx.json .
          # Collapse the per-module license tree into ONE THIRD-PARTY-LICENSES.txt
          # so the packages ship a handful of doc files, not a directory forest.
          {
            echo "Third-party license notices for zfleet"
            echo "Generated by go-licenses from the Go module dependency tree."
            echo "Each section is the verbatim license of one bundled module."
            echo
            find tpl-tree -type f | sort | while IFS= read -r f; do
              mod=${f#tpl-tree/}; mod=$(dirname "$mod")
              echo "================================================================================"
              echo "$mod"
              echo "================================================================================"
              echo
              cat "$f"
              echo
              echo
            done
          } > THIRD-PARTY-LICENSES.txt
          echo "Combined $(find tpl-tree -type f | wc -l) files -> THIRD-PARTY-LICENSES.txt ($(wc -l < THIRD-PARTY-LICENSES.txt) lines)"

      - name: License compatibility check (non-blocking)
        continue-on-error: true
        run: |
          "$(go env GOPATH)/bin/go-licenses" check ./cmd/zfleet --ignore github.com/martona/zfleet

      - name: Upload third-party license texts
        uses: actions/upload-artifact@v6
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload SBOM release asset
        uses: actions/upload-artifact@v6
        with:
          name: release-sbom
          path: zfleet.cdx.json
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: notices
    # Both arches are cross-built and cross-packaged from one amd64 runner
    # (pure Go + an arch-agnostic nfpm), so there is no per-arch job.
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test before release
        run: |
          gofmt -l . | tee /dev/stderr | wc -l | grep -qx 0
          go vet ./...
          go test ./...

      - name: Build static binaries (amd64 + arm64)
        env:
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ldflags="-s -w -X main.version=${{ inputs.tag }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "dist/zfleet-linux-$arch" ./cmd/zfleet
          done
          file dist/zfleet-linux-amd64 | grep -q "statically linked" || {
            echo "::error::dist/zfleet-linux-amd64 is not statically linked" >&2; exit 1; }

      - name: Download license texts
        uses: actions/download-artifact@v7
        with:
          name: third-party-licenses
          path: third-party-licenses

      - name: Package (deb/rpm/arch) + stage assets
        run: |
          set -euo pipefail
          mkdir -p release-stage
          for arch in amd64 arm64; do
            # Native packages -- package_linux.sh autodetects the downloaded
            # THIRD-PARTY-LICENSES.txt and bundles all license docs into the package.
            bash scripts/package_linux.sh --version "${{ inputs.version }}" \
              --binary "dist/zfleet-linux-$arch" --arch "$arch" --outdir "dist/pkg-$arch"
            # Version-LESS canonical names for stable releases/latest/download URLs
            # (the version still lives in package metadata + `zfleet --version`).
            # One .deb per arch also keeps pkg0's default '*ARCH.deb' glob unambiguous.
            cp "$(ls dist/pkg-$arch/*.deb)"         "release-stage/zfleet-linux-$arch.deb"
            cp "$(ls dist/pkg-$arch/*.rpm)"         "release-stage/zfleet-linux-$arch.rpm"
            cp "$(ls dist/pkg-$arch/*.pkg.tar.zst)" "release-stage/zfleet-linux-$arch.pkg.tar.zst"

            # Bare binary for the curl-and-chmod path.
            cp "dist/zfleet-linux-$arch" "release-stage/zfleet-linux-$arch"
          done

          # Confirm the release-specific THIRD-PARTY-LICENSES.txt bundling actually
          # rode into the shipped artifacts. Capture listings into vars and match with
          # a pipe-free `case` -- a `<lister> | grep -q` would SIGPIPE the lister under
          # `pipefail` (grep -q closes the pipe at first match).
          has() { case "$1" in *"$2"*) return 0 ;; *) return 1 ;; esac; }
          for arch in amd64 arm64; do
            deb_list="$(dpkg-deb -c "dist/pkg-$arch/"*.deb)"
            has "$deb_list" 'usr/share/doc/zfleet/THIRD-PARTY-LICENSES.txt' || {
              echo "::error::deb ($arch) missing THIRD-PARTY-LICENSES.txt" >&2; exit 1; }
          done
          ls -la release-stage/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: release-stage/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create release
    runs-on: ubuntu-latest
    needs: [notices, build-linux]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("artifacts")
          lines = []
          for path in sorted(p for p in root.iterdir() if p.is_file() and p.name != "SHA256SUMS.txt"):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.name}")
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="ascii")
          print((root / "SHA256SUMS.txt").read_text(encoding="ascii"), end="")
          PY
          ls -la artifacts/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'artifacts/*'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
